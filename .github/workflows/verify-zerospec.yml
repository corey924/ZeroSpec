name: Verify ZeroSpec

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmd: bash scripts/verify-zerospec.sh
          - os: windows-latest
            cmd: pwsh -File scripts/verify-zerospec.ps1
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run verification
        run: ${{ matrix.cmd }}

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: ShellCheck
        run: shellcheck scripts/verify-zerospec.sh

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Lychee link check
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          # skills/zerospec/prompts/ are generated copies of prompts/*.md.
          # Validate links in the canonical prompts only; copied payloads keep source-relative links.
          args: --offline --no-progress --exclude-path skills/zerospec/prompts '**/*.md'
          fail: true
